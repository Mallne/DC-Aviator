name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and validate every module on JVM
        run: >-
          ./gradlew --no-daemon
          :clients:ktor:jvmTest
          :clients:mock:jvmTest
          :plugins:adapter-json:jvmTest
          :plugins:adapter-xml:jvmTest
          :plugins:client:http-auth:jvmTest
          :plugins:client:interception:jvmTest
          :plugins:client:weaver:jvmTest
          :plugins:otel:jvmTest
          :plugins:client:synapse:jvmTest
          :core:jvmTest
          :koas:jvmTest
