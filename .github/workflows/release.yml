name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test JVM targets
        run: ./gradlew --no-daemon jvmTest

      - name: Publish release
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Aviator's JS-exported APIs are not supported by the Wasm compiler yet.
          # Omit the Wasm target consistently from both Maven and npm publications.
          # Refresh the generated npm lock at the release version, then keep JS compilation
          # within the memory available on GitHub-hosted runners. The Kotlin/JS npm
          # publish tasks require Gradle-managed Node, so enable its download for release.
          ./gradlew --no-daemon --max-workers=2 -PVERSION_NAME="$TAG_VERSION" \
            -PomitWasmJsForRelease=true kotlinUpgradePackageLock
          printf '//registry.mallne.cloud/repository/NodeRegistry/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          printf '@dicentra:registry=https://registry.mallne.cloud/repository/NodeRegistry/\n' >> "$HOME/.npmrc"
          # npm forbids overwriting published versions. Skip only package tasks whose exact
          # version already exists; publish all remaining package artifacts.
          declare -a NPM_PUBLISH_EXCLUDES=()
          while IFS='|' read -r project package; do
            if npm view "@dicentra/${package}@${TAG_VERSION}" version --registry=https://registry.mallne.cloud/repository/NodeRegistry/ >/dev/null 2>&1; then
              NPM_PUBLISH_EXCLUDES+=("-x" ":${project}:publishJsPackageToNodeRegistryRegistry")
            fi
          done <<'EOF'
          core|aviator-core
          koas|aviator-koas
          clients:fetch|aviator-client-fetch
          plugins:adapter-json|aviator-plugin-adapter-json
          plugins:adapter-xml|aviator-plugin-adapter-xml
          plugins:http-auth|aviator-plugin-http-auth
          plugins:interception|aviator-plugin-interception
          plugins:otel|aviator-plugin-otel
          plugins:synapse|aviator-plugin-synapse
          plugins:weaver|aviator-plugin-weaver
          EOF
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g \
            -Pkotlin.daemon.jvmargs=-Xmx3g -PdownloadNodeForRelease=true publish \
            -PVERSION_NAME="$TAG_VERSION" -PomitWasmJsForRelease=true "${NPM_PUBLISH_EXCLUDES[@]}"

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes --title ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version to next SNAPSHOT
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MAJOR=$(echo "$TAG_VERSION" | cut -d. -f1)
          MINOR=$(echo "$TAG_VERSION" | cut -d. -f2)
          PATCH=$(echo "$TAG_VERSION" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${NEXT_VERSION}/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${NEXT_VERSION} [skip ci]"
          git push origin HEAD:master
