name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and validate every module on JVM
        run: >-
          ./gradlew --no-daemon
          :clients:ktor:jvmTest
          :clients:mock:jvmTest
          :plugins:adapter-json:jvmTest
          :plugins:adapter-xml:jvmTest
          :plugins:http-auth:jvmTest
          :plugins:interception:jvmTest
          :plugins:weaver:jvmTest
          :plugins:otel:jvmTest
          :plugins:synapse:jvmTest
          :core:jvmTest
          :koas:jvmTest
